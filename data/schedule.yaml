# The daily schedule, in station time (one tick = one station minute).
# DESIGN.md Part two, Clock and daily schedule.

wakeChime:
  at: "07:00"
  minRest: 40            # sleepers with rest above this wake; the rest sleep on until rested
arrivals: "07:30"        # empty slots refill to seven
arrivalRoom: common      # where newcomers wake up
lightsDim: "23:00"       # bedtime isn't forced; sleeping is pulled harder until the wake chime

# Meals. Each contestant can eat once per meal `group`. `ranks` limits who is served there
# (newcomers count as ranks.yaml newcomerRank). What they're served depends on rank (ranks.yaml).
meals:
  - { id: breakfast, group: breakfast, from: "09:00", to: "10:00", room: cafe }
  - { id: lunch, group: lunch, from: "13:00", to: "14:00", room: cafe }
  - { id: dinner, group: dinner, from: "19:00", to: "20:30", room: lounge, ranks: [1, 6] }
  - { id: leftovers, group: dinner, from: "20:30", to: "21:00", room: common, ranks: [7, 7] }
mealMinutes: 30          # proposal: how long eating takes
# Proposal (day traces, Oct 29; john approved): the dinner bell. A meal opening wakes sleepers who
# haven't eaten that meal and are hungrier than this. Rank 7 slept through the leftovers, on the
# couch beside them, on half their days.
dinnerBell: { hungerBelow: 50 }

# Everyone awake attends. Ranks are assigned `resolveAfter` minutes in, once people have walked over.
ceremony:
  at: "21:00"
  minutes: 30            # proposal
  resolveAfter: 20       # proposal
  wakeAbove: 20          # proposal: the ceremony chime wakes sleepers with rest above this; the
                         # exhausted sleep through it, and skipping the ceremony is an infraction.
                         # Naps (Oct 27): was 40, then 30. Need sliders (Oct 28): 20, since beds
                         # refill slower and more people nap under 30; at 30, skipped-ceremony
                         # fines went 0.04 → 0.18 a day
  room: common

# The daily event (events.yaml picks the format). Everyone is summoned like the ceremony;
# skipping it is an infraction. It resolves `resolveAfter` minutes in.
event:
  at: "15:00"
  minutes: 60
  resolveAfter: 20       # proposal
  wakeAbove: 20          # proposal: as the ceremony (was 40, then 30)

# Pending trials (trials.yaml), held after the morning arrivals so newcomers can break ties.
trials:
  at: "07:45"
  minutes: 30            # proposal
  resolveAfter: 15       # proposal
  wakeAbove: 20          # proposal: as the ceremony (was 40)
  room: common
