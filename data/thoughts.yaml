# Thoughts and mood. DESIGN.md Part two, Thoughts, mood and breaks.
# Mood = personality.yaml mood.base + every active thought, kept to 0..100.
#
# Each thought: value, hours it lasts, stack (how many can be active at once about the same
# person; a new one replaces the oldest), and a source category, which picks the break when
# mood falls too far (breaks.yaml). A thought whose value works out to 0 isn't added.
# `species` replaces the value for those species (the fishbowl barely bothers aquatics).
# `scale` multiplies the value by personality: 1 + k × (axis − 5) ÷ 5 per entry (k defaults to 0.5).

# Every thought hits × 1 + volatileK × (calm − 5) ÷ 5: up to 1.4× when volatile.
volatileK: -0.4

# Species multipliers by source. Reptilians are less bothered by social hits.
species:
  reptilian: { person: 0.7, rejection: 0.7 }

# Personality by source (DESIGN.md Personality grid): brave people feel fear less, vain people
# feel rank more.
sources:
  fear:   [{ axis: brave, k: -0.5 }]
  status: [{ axis: vain }]
  # Proposals (dread tuning, Oct 22; john: personality should change what hurts): the loyal and
  # the kind grieve harder, the vain feel humiliation more, the outgoing feel rejection and
  # loneliness more, the honest and the kind feel guilt more.
  grief:       [{ axis: loyal }, { axis: kind, k: 0.3 }]
  humiliation: [{ axis: vain }]
  rejection:   [{ axis: outgoing }]
  guilt:       [{ axis: honest }, { axis: kind }]

# Proposal (dread tuning, Oct 22): bad thoughts of one source add up to at most this much, so a
# bad week of executions, sentences and doom can't pin mood at zero on its own. Each source (fear,
# humiliation, status, ...) is capped separately; good thoughts aren't capped. 0 turns it off.
sourceCap: 20
# Per-source caps that replace sourceCap, e.g. { fear: 12 }. Empty for now: john (Oct 22) held off
# on lowering the fear cap until later steps.
caps: {}

# Everyone carries this from the moment they arrive. Fear tuning (D-110, proposal): it eases from
# `from` to `to` over their first `days` aboard, refreshed hourly.
trapped: { thought: trapped, from: -5, to: -2, days: 7 }

# Proposal: low needs reach mood through these, refreshed every ten minutes while the need is
# below the line ("hungry, exhausted, filthy, lonely, bored").
needs:
  - { need: hunger,  below: 20, thought: hungry }
  - { need: rest,    below: 15, thought: exhausted }
  - { need: hygiene, below: 20, thought: filthy }
  - { need: social,  below: 20, thought: lonely }
  - { need: fun,     below: 20, thought: bored }
# Tuning proposal (M8): well-met needs lift mood too, as in RimWorld and The Sims. Without them
# almost nothing good reached mood and it sat near the break lines.
  - { need: social,  above: 80, thought: good_company }
  - { need: fun,     above: 80, thought: good_time }
  - { need: comfort, above: 70, thought: comfortable }

# Too cold / too hot: −perDegrees per degree felt outside your range, up to −max, refreshed every
# ten minutes while it lasts.
temperature: { cold: too_cold, hot: too_hot, perDegree: 0.5, max: 8 }

# A sleep has to last this long to leave a "slept on the couch / in the dorm / in the suite" thought.
sleepMinutes: 180   # proposal

# Joys and pains from the blend (DESIGN.md Personality, traits and mood: the next pass, step 3).
# Not one per trait: each moment leaves one thought whose `scale` reads the sliders (k: 1 means
# 0 at the bottom of the slider, so nothing at all), and traits multiply thoughts as usual. All proposal.
moments:
  helped:    { thought: helped, interactions: [kind_words, gift, pass_food] }  # whoever helped (kind, loyal)
  risky:     { thought: thrill, tag: risky, infractions: [above_rank] }        # finishing something risky, or sneaking in (brave)
  guilt:     { thought: guilty_conscience, infractions: [above_rank, theft] }  # caught sneaking or stealing (honest)
  watched:   { thought: watched_performing, events: [karaoke, dance_off] }     # performing with an audience (vain)
  breakdown: { thought: saw_breakdown }                                        # in the room when someone breaks (kind)

thoughts:
  trapped:     { label: "Trapped here", value: -5, hours: 100000, stack: 1, source: fear }   # value set by `trapped` above

  # Traits (traits.yaml). All proposal.
  sunny:       { label: "Sunny disposition", value: 4, hours: 100000, stack: 1, source: temperament }
  gloomy:      { label: "Gloomy disposition", value: -4, hours: 100000, stack: 1, source: temperament }
  crowded:     { label: "Too many people", value: -2, hours: 0.5, stack: 1, source: discomfort }
  everyone_watching: { label: "Everyone was watching", value: 4, hours: 3, stack: 1, source: status }
  enjoyed_attention: { label: "Enjoyed the attention", value: 3, hours: 6, stack: 1, source: status }

  # Joys and pains (moments above). All proposal.
  helped:        { label: "Helped {who}", value: 3, hours: 12, stack: 2, source: person,
                   scale: [{ axis: kind, k: 1 }, { axis: loyal }] }
  thrill:        { label: "What a rush", value: 4, hours: 6, stack: 1, source: status, scale: [{ axis: brave, k: 1 }] }
  guilty_conscience: { label: "Guilty conscience", value: -3, hours: 24, stack: 1, source: guilt,
                   scale: [{ axis: honest }] }   # the guilt source scales by honest and kind too
  watched_performing: { label: "All eyes on me", value: 3, hours: 3, stack: 1, source: status, scale: [{ axis: vain, k: 1 }] }
  saw_breakdown: { label: "Watched {who} fall apart", value: -2, hours: 12, stack: 2, source: sympathy,  # sympathy picks
                   scale: [{ axis: kind, k: 1 }] }                                                      # no break

  # Needs and comfort
  hungry:      { label: "Hungry", value: -4, hours: 0.5, stack: 1, source: hunger }            # proposal
  exhausted:   { label: "Exhausted", value: -6, hours: 0.5, stack: 1, source: discomfort }     # proposal
  filthy:      { label: "Couldn't wash", value: -6, hours: 0.5, stack: 1, source: discomfort } # "couldn't wash −6"
  lonely:      { label: "Lonely", value: -4, hours: 0.5, stack: 1, source: rejection }         # proposal
  bored:       { label: "Bored stiff", value: -4, hours: 0.5, stack: 1, source: discomfort,    # proposal
                 scale: [{ axis: playful }] }
  good_company: { label: "Good company", value: 6, hours: 0.5, stack: 1, source: person }        # proposal (M8)
  good_time:   { label: "Having a good time", value: 6, hours: 0.5, stack: 1, source: discomfort, # proposal (M8)
                 scale: [{ axis: playful }] }
  comfortable: { label: "Comfortable", value: 3, hours: 0.5, stack: 1, source: discomfort }      # proposal (M8)
  too_cold:    { label: "Too cold", value: -1, hours: 0.5, stack: 1, source: discomfort }      # value set by the temperature line
  too_hot:     { label: "Too hot", value: -1, hours: 0.5, stack: 1, source: discomfort }
  slept_couch: { label: "Slept on the couch", value: -6, hours: 24, stack: 1, source: discomfort, scale: [{ axis: vain }] }
  slept_dorm:  { label: "Slept in the dorm", value: -2, hours: 24, stack: 1, source: discomfort, scale: [{ axis: vain }] }
  slept_suite: { label: "Slept in the suite", value: 6, hours: 24, stack: 1, source: status, scale: [{ axis: vain }] }
  ate_gourmet: { label: "Ate gourmet", value: 6, hours: 24, stack: 1, source: hunger }
  ate_leftovers: { label: "Ate leftovers", value: -4, hours: 24, stack: 1, source: hunger }
  cold_shower: { label: "Cold shower", value: -4, species: { aquatic: 0 }, hours: 24, stack: 1, source: discomfort }
  sink_bath:   { label: "Sink bath", value: -4, hours: 24, stack: 1, source: humiliation }
  dressed_star: { label: "Dressed like a star", value: 3, hours: 25, stack: 1, source: status, scale: [{ axis: vain }] }
  dressed_nobody: { label: "Dressed like nobody", value: -3, hours: 25, stack: 1, source: status, scale: [{ axis: vain }] }

  # People
  insulted:    { label: "Insulted by {who}", value: -6, hours: 48, stack: 3, source: person }
  slighted:    { label: "Slighted by {who}", value: -3, hours: 24, stack: 3, source: person }      # proposal
  kind_words:  { label: "Kind words from {who}", value: 5, hours: 12, stack: 2, source: person } # hours: proposal
  rebuffed:    { label: "Rebuffed by {who}", value: -8, hours: 48, stack: 2, source: rejection }
  awkward:     { label: "Awkward flirt from {who}", value: -3, hours: 12, stack: 1, source: rejection } # proposal
  turned_away: { label: "Turned away at the door by {who}", value: -5, hours: 24, stack: 2, source: rejection }
  lost_fight:  { label: "Lost a fight to {who}", value: -8, hours: 24, stack: 2, source: person }  # proposal
  won_fight:   { label: "Won a fight against {who}", value: 3, hours: 12, stack: 2, source: person } # proposal
  saw_cruelty: { label: "Watched {who} be cruel", value: -2, hours: 12, stack: 2, source: person,   # proposal: "witnessing
                 scale: [{ axis: kind }] }                                                         # cruelty hurts more"
  gifted:      { label: "{who} brought me a drink", value: 4, hours: 12, stack: 2, source: person } # proposal
  wrecked:     { label: "{who} wrecked my things", value: -8, hours: 48, stack: 1, source: person } # proposal
  # People as mood (social.yaml people). All proposal.
  with_friend:   { label: "Hanging out with {who}", value: 6, hours: 0.5, stack: 1, source: person, scale: [{ axis: outgoing }] }
  with_partner:  { label: "With {who}", value: 6, hours: 0.5, stack: 1, source: romance, scale: [{ axis: loyal }] }
  stuck_with:    { label: "Stuck with {who}", value: -6, hours: 0.5, stack: 1, source: person, scale: [{ axis: calm, k: -0.5 }] }
  friend_doomed: { label: "{who} is on the chopping block", value: -2, hours: 1.5, stack: 1, source: grief, scale: [{ axis: loyal }] }
  missing_them:  { label: "Missing {who}", value: -4, hours: 1.5, stack: 1, source: rejection, scale: [{ axis: loyal }] }
  envy:          { label: "{who} has it better", value: -3, hours: 1.5, stack: 1, source: envy, scale: [{ axis: vain }] }

  # Romance
  kissed:        { label: "Kissed {who}", value: 6, hours: 24, stack: 1, source: romance }          # proposal
  kiss_rebuffed: { label: "Kiss rebuffed by {who}", value: -12, hours: 48, stack: 1, source: rejection }
  lovin:         { label: "Lovin' with {who}", value: 10, hours: 24, stack: 1, source: romance }
  turned_down:   { label: "Turned down by {who}", value: -10, hours: 24, stack: 1, source: rejection } # hours: proposal
  disturbed:     { label: "Kept up by the roommates", value: -3, hours: 12, stack: 1, source: discomfort } # proposal
  saw_lovin:     { label: "Saw {who} going at it in public", value: -4, hours: 12, stack: 1, source: person,  # proposal
                   scale: [{ axis: modesty, k: 1 }] }                                                      # the shameless don't mind

  # Beds, sleep and privacy (needs.yaml sleep). All proposal.
  slept_beside:  { label: "Slept beside {who}", value: 4, hours: 24, stack: 1, source: romance }
  shared_bed:    { label: "Had to share a bed with {who}", value: -5, hours: 24, stack: 1, source: person }
  share_refused: { label: "{who} wouldn't share a bed", value: -3, hours: 12, stack: 1, source: rejection }
  kept_up:       { label: "{who} kept me up", value: -4, hours: 24, stack: 1, source: discomfort }
  no_privacy:    { label: "No privacy", value: -3, hours: 6, stack: 1, source: humiliation, scale: [{ axis: modesty, k: 1 }] }
  exclusive:     { label: "Exclusive with {who}", value: 5, hours: 48, stack: 1, source: romance }     # proposal
  not_exclusive: { label: "{who} won't commit", value: -10, hours: 24, stack: 1, source: rejection }   # "Hurt: −10"
  dumped:        { label: "Dumped by {who}", value: -20, hours: 72, stack: 1, source: rejection }      # hours: proposal
  betrayed:      { label: "Betrayed by {who}", value: -20, hours: 168, stack: 1, source: person, scale: [{ axis: loyal }] }
  jealous:       { label: "Jealous of {who}", value: -5, hours: 24, stack: 2, source: person }         # proposal
  guilty:        { label: "Cheating on {who}", value: -5, hours: 24, stack: 1, source: guilt }         # proposal

  # Booze (booze.yaml)
  drink_fancy:   { label: "Savored something special", value: 6, hours: 3, stack: 3, source: booze, scale: [{ axis: vain }] }
  drink_good:    { label: "A good drink", value: 4, hours: 3, stack: 3, source: booze }
  drink_cheap:   { label: "A cheap drink", value: 2, hours: 3, stack: 3, source: booze }
  drink_rotgut:  { label: "Rotgut", value: 1, hours: 3, stack: 3, source: booze }
  hangover:      { label: "Hungover", value: -3, hours: 8, stack: 1, source: discomfort }   # value set by booze.yaml hangover

  # Breaks (breaks.yaml)
  catharsis:     { label: "Catharsis", value: 15, hours: 24, stack: 1, source: catharsis }

  # The show
  doomed:        { label: "The show is going to kill me", value: -4, hours: 1.5, stack: 1, source: fear }  # value set by meter.yaml doomed
  sentenced:     { label: "Sentenced in public", value: -10, hours: 24, stack: 1, source: humiliation }
  fishbowl_night: { label: "A night in the fishbowl", value: -12, species: { aquatic: -4 }, hours: 24, stack: 1, source: humiliation }
  rank_up:       { label: "Rank went up", value: 5, hours: 24, stack: 1, source: status }
  rank_down:     { label: "Rank went down", value: -8, hours: 24, stack: 1, source: status }
  mocked:        { label: "Mocked through the glass by {who}", value: -4, hours: 12, stack: 2, source: humiliation } # proposal
  fed:           { label: "{who} passed food through the slot", value: 4, hours: 12, stack: 1, source: person }     # proposal

  # Deaths
  watched_execution: { label: "Watched an execution", value: -8, hours: 48, stack: 3, source: fear }
  someone_died:  { label: "{who} died", value: -6, hours: 72, stack: 1, source: fear }
  friend_died:   { label: "My friend {who} died", value: -12, hours: 168, stack: 1, source: grief }
  rival_died:    { label: "{who} got what was coming", value: 6, hours: 72, stack: 1, source: person,
                   scale: [{ axis: kind, k: -0.8 }] }      # proposal: the cruel gloat more
  relieved_died: { label: "Can't say I'll miss {who}", value: 3, hours: 48, stack: 1, source: person,
                   scale: [{ axis: kind, k: -0.8 }] }      # proposal
  saw_murder:    { label: "Saw {who} kill someone", value: -12, hours: 72, stack: 1, source: fear }  # proposal
  found_body:    { label: "Found {who}'s body", value: -10, hours: 72, stack: 1, source: fear }

  # The Wheel, the daily event and trials (all proposals)
  spun_wheel:    { label: "Had to spin the Wheel", value: -5, hours: 24, stack: 1, source: fear }
  won_immunity:  { label: "Won a secret immunity", value: 8, hours: 48, stack: 1, source: status }
  won_dance_off: { label: "Won the dance-off", value: 5, hours: 24, stack: 1, source: status }
  lost_dance_off: { label: "Lost the dance-off", value: -4, hours: 24, stack: 1, source: humiliation, scale: [{ axis: vain }] }
  accused:       { label: "Accused of murder by {who}", value: -15, hours: 72, stack: 1, source: person }
  survived_trial: { label: "Survived a trial", value: 10, hours: 72, stack: 1, source: catharsis }
