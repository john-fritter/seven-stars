# The station as a graph of rooms. DESIGN.md Part two, Rooms, objects and access.
#
# access:      all | ranks | occupants | robots
#              ranks uses `ranks: [best, worst]`; occupants means whoever has a bed there (guests come later)
# privacy:     apparent privacy contestants believe, 0..1 (proposal: low 0.2, medium 0.5, high 0.8)
# temperature: the setting in °F. Rooms with a thermostat object let occupants change it.
# comfort:     proposal, 0..100: how comfortable it is just to be here, before temperature
# objects:     object type -> how many (types are in objects.yaml)
# glass:       a glass cell inside another room: people on either side can see and talk through it
#              (only the interactions marked `glass` in social.yaml), and nobody walks in or out

rooms:
  - { id: common, name: Common room, access: all, privacy: 0.2, temperature: 66, comfort: 45,
      objects: { couch: 4 } }
  - { id: cafe, name: Cafe, access: all, privacy: 0.2, temperature: 70, comfort: 50, objects: {} }
  - { id: lounge, name: Lounge, access: ranks, ranks: [1, 6], privacy: 0.2, temperature: 70, comfort: 60,
      objects: { dance_floor: 1, karaoke_stage: 1, window_seat: 2 } }
  - { id: rec, name: Rec room, access: ranks, ranks: [1, 6], privacy: 0.2, temperature: 70, comfort: 55,
      objects: { arcade: 1, bowling_lane: 1, vending_snacks: 1 } }
  - { id: cage, name: Cage room, access: all, privacy: 0.2, temperature: 70, comfort: 35, objects: {} }
  - { id: spa, name: Spa, access: ranks, ranks: [1, 3], privacy: 0.5, temperature: 76, comfort: 75,
      objects: { hot_tub: 1 } }
  - { id: restroom, name: Public restroom, access: all, privacy: 0.5, temperature: 70, comfort: 30,
      objects: { stall_toilet: 3, sink: 3 } }
  - { id: garden, name: Garden, access: all, privacy: 0.5, temperature: 70, comfort: 60,
      objects: { garden_bench: 2, plants: 1 } }
  - { id: confessional, name: Confessional, access: all, privacy: 0.8, temperature: 70, comfort: 40, objects: {} }
  - { id: medbay, name: Medbay, access: all, privacy: 0.5, temperature: 70, comfort: 40, objects: {} }
  - { id: suite, name: Suite, access: occupants, privacy: 0.8, temperature: 70, comfort: 80,
      objects: { bed_suite: 1, toilet: 1, sink: 1, shower_hot: 1, thermostat: 1 } }
  - { id: good, name: Good room, access: occupants, privacy: 0.5, temperature: 70, comfort: 65,
      objects: { bed_good: 2, toilet: 1, sink: 1, shower_hot: 1, thermostat: 1 } }
  - { id: dorm, name: Basic dorm, access: occupants, privacy: 0.2, temperature: 70, comfort: 45,
      objects: { bed_dorm: 3, toilet: 1, sink: 1, shower_cold: 1, thermostat: 1 } }
  # The fishbowl: a glass cell in the common room for the sentenced, kept slightly too cold.
  # Proposal: a hard floor to sleep on and a toilet in full view.
  - { id: fishbowl, name: The fishbowl, access: robots, glass: common, privacy: 0, temperature: 61, comfort: 15,
      objects: { fishbowl_floor: 1, toilet: 1 } }
  - { id: airlock, name: Airlock, access: robots, privacy: 0, temperature: 70, comfort: 0, objects: {} }

# Walking minutes between adjacent rooms. Proposal until the floor plan exists: the common room
# is the hub, the lounge connects to the spa and the rec room. Other trips take the shortest path.
links:
  - [common, cafe, 1]
  - [common, restroom, 1]
  - [common, confessional, 1]
  - [common, lounge, 2]
  - [common, rec, 2]
  - [common, cage, 2]
  - [common, garden, 2]
  - [common, medbay, 2]
  - [common, good, 2]
  - [common, dorm, 2]
  - [common, suite, 3]
  - [common, airlock, 2]
  - [common, fishbowl, 1]
  - [lounge, spa, 1]
  - [lounge, rec, 1]
