# Things worth doing: the gym, cards, getting ready, rehearsing, and tomorrow's bill. DESIGN.md
# Part two, How contestants choose: wants and things to do. All proposal (Oct 30). The actions
# themselves are in objects.yaml; this is what they do.

# Training (objects.yaml `trains`): every minute of an action that trains a skill adds
# perHour ÷ 60 to it (0..1), and every hour it fades by fadePerHour, so a morning on the heavy bag
# counts at the afternoon's cage match but not next week's.
training:
  perHour: 0.5
  fadePerHour: 0.03
  # What a trained skill is worth: fight power + fight × skill (social.yaml fight.power: strength
  # and stamina, 1 each, on 1..10 stats, plus a die of 6), dance score + dance × skill.
  fight: 3
  dance: 4

# Tomorrow's bill: after the Wheel at the ceremony, if the Wheel hasn't booked tomorrow's event,
# the host announces it: the next format in the rotation and, for a cage match, the two who like
# each other least (events.yaml rematch counts); for a dance-off, two to four dancers drawn at
# random. Anyone in the fishbowl is left off. A booked contestant who doesn't turn up forfeits, as
# with the Wheel's bookings.
bill: true

# Cards (objects.yaml card_table): every `hand` minutes, a table with two or more players in
# their seats plays a hand. Each player's hand: a die of `die` + poker face (calm × face).
# The dishonest may cheat: odds cheat × (10 − honest) ÷ 10, worth +cheatBonus; each other
# player spots it with odds spot × (their honesty ÷ 10 + 0.5), and calls them on it (an insult,
# which can come to blows). Stakes: the winner takes a snack from each loser who has one.
# The winner gets `won`; a loser with calm under soreBelow sulks (`lost`, affection toward the
# winner). One player alone at a table just shuffles: the seat scores × alone.
cards:
  hand: 15
  die: 10
  face: 0.3
  cheat: 0.25
  cheatBonus: 4
  spot: 0.4
  won: won_at_cards
  lost: lost_at_cards
  soreBelow: 4
  sore: -4
  cheated: cheated_at_cards
  alone: 0.35

# Getting ready (objects.yaml mirror, `primps`): only in the hours before the ceremony (the
# action's window). Finishing it, they look `beauty` better (attraction's looks, on 0..10) until
# `until`, and feel it (the action's thought).
ready:
  until: "02:00"
  beauty: 1.5
