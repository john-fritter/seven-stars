# Needs run 0 (desperate) to 100 (satisfied). DESIGN.md Part two, Needs.
# Species drain multipliers are in species.yaml, personality ones in personality.yaml.

needs:
  hunger:  { drainPerHour: 6,  weight: 1.2, start: [60, 90] }
  rest:    { drainPerHour: 4,  weight: 1.0, start: [70, 95] }
  hygiene: { drainPerHour: 3,  weight: 0.6, start: [60, 90] }
  bladder: { drainPerHour: 15, weight: 1.5, start: [60, 100] }
  social:  { drainPerHour: 8,  weight: 0.8, start: [50, 80] }   # fun and social (Oct 27): was 5
  fun:     { drainPerHour: 4,  weight: 0.7, start: [50, 80] }
  comfort: { drainPerHour: 0,  weight: 0.5, start: [50, 50] }   # set by surroundings, see comfortFollowPerHour

# Proposal: drain multipliers while asleep (rest refills instead of draining).
# Fun and social (Oct 27): were 0, so everyone woke as topped up as they went to bed.
asleepDrain: { hunger: 0.5, rest: 0, hygiene: 1, bladder: 0.3, social: 0.3, fun: 0.3, comfort: 0 }

sleep:
  restPerHour: 9         # × the bed's quality: suite 1.2, good 1.0, dorm 0.8, couch 0.6
                         # need sliders (Oct 28): was 12, so every bed, couch included, refilled more than a
                         # day's rest and a snorer or a hummer cost nothing
  # The body clock (proposal, Oct 29; john: "it should be harder for people to sleep in the day,
  # you're fighting the circadian rhythm"). Two forces, as in people: sleep pressure (low rest) and
  # a daily alertness curve. `sleepLine` is the rest below which they can drop off at that time of
  # their day (night owls and early birds shift it with their night): high through the night, a
  # dip after lunch, lowest in the early evening, when it's hard to drop off. Asleep, they wake
  # once rest is `margin` above the line, so by day a doze ends as the curve climbs and by night
  # (line 90 + margin) they sleep until rested. Replaces napBelow 30 (Oct 27), which let a nap
  # that started at 16:00 run to the 21:00 chime.
  clock:
    sleepLine:
      - { at: "00:00", rest: 90 }
      - { at: "05:00", rest: 90 }
      - { at: "06:30", rest: 60 }
      - { at: "08:00", rest: 30 }
      - { at: "12:00", rest: 25 }
      - { at: "14:30", rest: 35 }    # the post-lunch dip
      - { at: "16:30", rest: 25 }
      - { at: "18:00", rest: 12 }    # the early-evening peak of alertness
      - { at: "20:30", rest: 12 }
      - { at: "22:00", rest: 30 }
      - { at: "23:00", rest: 80 }
    margin: 12
    # From this line up it's bedtime (about 22:20, or their own night): a bed of their own pulls as
    # at night, so a tired person heads to bed, not the nearest couch.
    bedtime: 45
    # Sleeping somewhere uncomfortable (spot comfort under `below`: the couch 40, the fishbowl
    # floor 15) wakes them now and then; awake at night, their own bed's pull takes them there.
    restless: { below: 45, perHour: 0.25 }
  # Proposal: every bed sleeps two. Sharing is welcome with someone they fancy and unwelcome
  # otherwise. Scoring a bed with someone in it (or a host's bed), the bedmate adds
  #   pull × (attraction − neutral) ÷ 10 + labels[their label for the bedmate]
  # Waking after a real night (thoughts.yaml sleepMinutes) beside someone leaves `good` when that
  # came out at 0 or more, `bad` otherwise, about the bedmate.
  share:
    neutral: 5
    pull: 3
    labels: { fling: 1, dating: 3, exclusive: 4 }
    partners: [dating, exclusive]   # proposal (relationship tuning): a host lets these in even if it means being woken
    reluctant: 0.3       # asked to share (a knock or a roommate asking), a host who'd rather not says yes this much less often
    refused: share_refused   # the asker's thought on a no (milder than being turned away at the door)
    good: slept_beside
    bad: shared_bed
  # Proposal: a snorer asleep or a hummer awake in the room cuts other sleepers' rest gain to
  # restMult, with wakeChance a minute of waking them. A bed in a room with someone noisy in it
  # right now costs `cost` in scoring. Waking after a disturbed sleep: `thought` about the
  # culprit and affection toward them.
  noise:
    restMult: 0.7
    wakeChance: 0.003
    cost: 1
    thought: kept_up
    affection: -3
    throughWall: 0.5     # proposal (floor plan): noise next door counts this much (rest lost and the wake chance)
    lieAwake: 15         # proposal (need sliders): woken in the night, they lie awake this many minutes first

bladder:
  criticalBelow: 10      # proposal: below this it overrides everything and they head for a toilet
  waitMinutes: 2         # proposal: when every toilet they can use is taken, they queue this long and look again

# Proposal (fun and social, Oct 27). Social was offered about six times what it drained and fun about
# three and a half times, and only the clock ever lowered either, so both sat at 90+ almost all day.
# Drain multipliers in the wrong places, awake only:
#   alone:    nobody else awake in the room
#   idle:     killing time (nothing worth doing, queueing for a toilet, turned away at a door)
situational:
  alone: { social: 1.5 }
  idle: { actions: [idle, wait, at_door, brushed_off], drain: { fun: 2 } }
# Recreation wears thin: each action's gains of these needs × max(floor, 1 − tolerance), where
# tolerance rises by perUse over one go (spread over its minutes, to at most 1) and falls
# recoverPerHour. Window-staring and dancing on repeat give less and less.
tolerance: { needs: [fun], perUse: 0.3, recoverPerHour: 0.04, floor: 0.4, appealFloor: 0.15 }
# Proposal (boredom, Oct 29; john: "the boredom fix should have taken care of the window"). It only
# trimmed fun, and fun wasn't why people sat there. Now any pastime (not a chore, sleep, a drink or
# a meal) wears with use, and its whole appeal is × the larger of appealFloor and 1 − tolerance,
# so the window is lovely for half an hour and dull by the third time. Time with the same person
# wears the same way (social.yaml company.talk).
# The bored stir things up: b = (below − fun) ÷ below. Interaction chance × 1 + chance × b; these
# interactions' weights × 1 + k × b (still scaled by their taste, so the kind rarely insult);
# actions with these tags × 1 + k × b.
boredom:
  below: 60
  chance: 0.5
  interactions: { flirt: 1.5, kiss: 1, proposition: 1, slight: 1.5, insult: 1.5 }
  tags: { risky: 1.5, illicit: 1, performing: 1, drinking: 0.5, game: 0.5 }

comfortFollowPerHour: 30 # proposal: how fast comfort moves toward the current situation's comfort

# Proposal (need sliders, Oct 28; john: "if you fight a cage match you should be more tired and
# hungry"). What people do wears on them, by action id: `perHour` drains that much more an hour
# while doing it (negative: restful), `cost` comes off once it's done. Fights cover cage matches.
exertion:
  fight:    { cost: { rest: -10, hunger: -8, hygiene: -15 } }
  lovin:    { cost: { rest: -8, hunger: -5, hygiene: -15 } }    # a shower calls
  toilet:   { cost: { hygiene: -3 } }                           # until they wash their hands (the sink gives +5)
  dance:    { perHour: { rest: 4, hunger: 3, hygiene: 4 } }     # sweat
  bowl:     { perHour: { rest: 4, hunger: 3, hygiene: 6 } }
  karaoke:  { perHour: { rest: 3, hygiene: 4 } }
  arcade:   { perHour: { hygiene: 2 } }
  tend_plants: { perHour: { rest: 2, hygiene: 4 } }             # dirt under the nails
  tantrum:  { cost: { rest: -8, hunger: -4, hygiene: -5 } }
  wreck:    { cost: { rest: -5, hygiene: -5 } }
  blowup:   { cost: { rest: -8, hygiene: -5 } }
  panic:    { cost: { rest: -8 } }
  sit:      { perHour: { rest: -2 } }
  gaze:     { perHour: { rest: -2 } }
  bench:    { perHour: { rest: -2 } }
  soak:     { perHour: { rest: -3 } }

# Proposal (need sliders): short of sleep, short of temper. Under rest `restBelow` their break
# lines sit `breakLines` higher and an insult starts a fight × `fight` as often.
fuse: { restBelow: 25, breakLines: 5, fight: 1.5 }
# Proposal: anyone under hygiene `below` is this much less attractive to everyone (attraction
# 0–10; it counts for flirts, kisses and propositions). The neat freak's dislike is on top.
grubby: { below: 20, attraction: 1 }
