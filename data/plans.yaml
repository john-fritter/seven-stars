# The floor plan. DESIGN.md Part two, The floor plan. All of it is proposal: john is trying
# three shapes (Oct 27) before choosing one.
#
# use:         which plan the station is built on (the harness takes --plan to switch)
# walkSpeed:   tiles a minute (a tile is a metre); walks take max(1, round(path length ÷ walkSpeed))
# detour:      a walk only crosses corridors and the plan's `through` rooms, and nowhere private;
#              any other public room costs this × its distance to cross (so the spa is reached
#              through the lounge, and nobody else cuts through the lounge)
# corridor:    what every corridor is like: access all, no objects
# soundproof:  rooms nothing carries in or out of through the walls
#
# Each plan:
#   size:       the deck, [width, height]
#   through:    rooms people walk through on their way somewhere, besides corridors
#   windows:    wall segments that look out into space (drawing only for now)
#   rooms:      every room in rooms.yaml: [x, y, width, height]. Only a glass cell may sit inside
#               another room (the fishbowl in the common room).
#   corridors:  extra spaces for walking: { id, name, rect }
#   openings:   { a, b, kind, at: [x1, y1, x2, y2] } on the wall a and b share.
#               door:  walk through it; it blocks sight and sound
#               arch:  walk through it, and see and hear through it
#               glass: see through it, nothing more
#               bend:  where two corridors meet round a corner; walk, but no line of sight
# Rooms that share a wall hear each other's noise (needs.yaml noise.throughWall).

use: ring
walkSpeed: 25
detour: 5
corridor: { privacy: 0.3, temperature: 68, comfort: 40 }
soundproof: [suite]

plans:
