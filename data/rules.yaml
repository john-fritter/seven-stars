# Rules, infractions, sentences and the fishbowl. DESIGN.md Part two, Rank, privileges, rules
# and punishments. Detection is total; sentencing waits for the ceremony.

# Each infraction has a starting step on the sentence ladder below. Proposal: one sentence per
# contestant per ceremony, at the highest step among their infractions, one step higher for each
# extra infraction that day ("a second infraction the same day bumps the sentence up a step").
infractions:
  above_rank:       { label: "Entering above rank", step: 1 }
  skipped_ceremony: { label: "Skipping the ceremony", step: 1 }
  skipped_event:    { label: "Skipping an event", step: 1 }    # the daily event or a trial
  fighting:         { label: "Fighting outside the cage", step: 2 }
  theft:            { label: "Theft", step: 3,                 # the only theft is raiding the cafe's food,
                      collective: [cold_water, no_breakfast], blame: -5 }   # so everyone pays tomorrow
  damage:           { label: "Damaging the set", step: 3 }     # arrives with breaks
  cameras:          { label: "Interfering with the cameras", step: 4 }   # arrives with breaks

# collective: station effects (wheel.yaml) everyone suffers the day after the sentence, and
# blame: how much everyone else's affection for the guilty one moves (proposal: −5).

# The ladder, mildest first. meter: a penalty applied at the ceremony. fishbowl: "night" until the
# release time below, "day" for dayHours.
sentences:                      # M8 tuning: was −10, −15, —, −20. With the infraction (4) and
  - { meter: -20 }               # sentence (6) awards, a −10 sentence cost nothing on the meter.
  - { meter: -25 }
  - { fishbowl: night }
  - { fishbowl: day, meter: -30 }

# Rule of cool: an infraction whose own act scored at least minPoints for that contestant is
# waived with this chance.
waiver: { minPoints: 10, chance: 0.3 }

# Proposal: an above-rank entry is logged once per room per contestant between ceremonies.
# Sneaking in is a choice: actions in rooms above their rank are scored as usual, minus
#   cost × (1 + honestK × (honest − 5) ÷ 5) × (1 + braveK × (brave − 5) ÷ 5)
#        × (1 + peril.k × max(0, 1 − meter ÷ peril.below)),
# so honest and timid people rarely risk it, and nobody near the bottom of the meter risks a fine
# for a hot shower. Season logs (Oct 23): cost was 1.5 with no peril, and 70% of deaths came the
# night of a fine for sneaking in, mostly for a shower or the toilet in the suite or good room.
sneak: { cost: 1.5, honestK: 0.5, braveK: -0.5, peril: { below: 40, k: 3 } }

# Proposal: who fights outside the cage gets the infraction: both fighters.
fighting: both

sentencedThought: sentenced     # "Sentenced in public"

fishbowl:
  room: fishbowl
  release: "07:00"              # an overnight sentence ends here
  dayHours: 24
  douseEvery: 60                # minutes between cold showers
  douseHygiene: 10              # proposal: hygiene from each dousing (douseSpecies replaces it)
  douseSpecies: { aquatic: 30 }
  thought: fishbowl_night

# Spacing at the ceremony, and what everyone else feels about a death.
spacing:
  watched: watched_execution    # everyone at the ceremony
  died: someone_died            # everyone else
  friend: friend_died
  rival: rival_died
  # Proposals (dread tuning, Oct 22; john: who dies should matter). Between rival and friend,
  # "someone died" is its value + perAffection × affection: worse for someone they liked, milder
  # for someone they didn't (−6 at 0, −9 at +29, −3 at −29). Down to `dislikedAt`, it's relief
  # instead. The kind (`kindForgives` and up, drunk kindness counts) feel a death they'd gloat
  # over as a plain "someone died".
  diedPerAffection: -0.1
  dislikedAt: -15
  disliked: relieved_died
  kindForgives: 8
