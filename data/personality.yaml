# The personality grid. DESIGN.md Part two, Personality grid.
# Every effect is a multiplier: 1 + k × (axis − 5) / 5, so an axis at 5 changes nothing.

axes: [outgoing, kind, honest, calm, loyal, brave, vain, playful]
k: 0.5

# Need drain scaled by an axis.
needDrain:
  social: outgoing
  fun: playful

# Action tags scaled by axes. k defaults to the k above; a negative k pulls the other way.
tags:
  social:     [{ axis: outgoing }]
  crowd:      [{ axis: outgoing }]
  solitary:   [{ axis: outgoing, k: -0.5 }]
  quiet:      [{ axis: outgoing, k: -0.5 }]
  performing: [{ axis: outgoing }, { axis: vain }, { axis: playful }]
  game:       [{ axis: playful }]
  status:     [{ axis: vain }]
  risky:      [{ axis: brave }]
  fitness:    [{ axis: vain }, { axis: brave, k: 0.3 }]   # proposal (Oct 30): the gym

# Mood below lowBelow scales these tags (DESIGN.md Part two, Choosing actions).
mood:
  base: 50              # mood starts here and adds every active thought
  lowBelow: 40
  multipliers: { solitary: 1.3, comforting: 1.3, social: 0.7 }
  # Proposal (people as mood): mood changes who they are to others, both ways. Under lowBelow these
  # interactions' weights are multiplied by `low`; above highAbove, by `high`.
  highAbove: 60
  interactions:
    low:  { slight: 1.5, insult: 1.5, glass_mock: 1.5 }
    high: { kind_words: 1.5, gift: 1.5, pass_food: 1.5 }
