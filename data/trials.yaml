# Bodies and placeholder trials. DESIGN.md Part two, Arrivals, deaths and trials. Trials run on
# knowledge and feelings, not speech. The hour they're held is in schedule.yaml trials.

# A murder nobody saw leaves a body where it fell until someone walks in on it (the killer
# doesn't count); the announcer declares any still unfound at the ceremony.
foundThought: found_body

# Seen near the victim: in the murder room within this many minutes before the murder.
nearMinutes: 60         # proposal

# Each contestant's suspicion of each other one, 0..100:
#   witnessed the murder: `witnessed` on the killer, nothing on anyone else
#   otherwise: dislike × −affection (if negative) + fear × fear + `enemy` if the suspect and the
#   victim were rivals (either way; only if they know of it, plots.yaml grudges) + `near` if both
#   were seen near the victim + `heard` if they've been told this one did it
suspicion: { witnessed: 100, dislike: 0.3, fear: 0.3, enemy: 30, near: 40, locked: 60, heard: 50 }   # proposal
# Proposal (Nov 18): `locked` more on anyone who was locked in a glass cell with the victim (two
# prisoners in the fishbowl): whoever finds the body sees who's in there with it. A body is found by
# anyone awake who can see it (through glass or an arch), not only someone who walks in.

# The contestant with the highest suspicion × brave ÷ 10 accuses their top suspect, if it's at
# least this. Below it, nobody dares and there's no trial.
accuseAt: 15            # proposal
# Proposal (Nov 18, john: reluctant to accuse without a good reason and a room they can convince,
# but free to accuse someone just because they dislike them if they think they'll get away with
# it). They read the room first: they accuse only if they expect at least `convince.need` of the
# others to side with them (a voter their feelings don't split counts half), less `convince.brave`
# × (brave − 5) ÷ 5 (the brave chance worse odds), plus `convince.spite` without a real reason.
# A real reason is `reason` or more of what they could put to the room: what they saw, bad blood
# they know of, being seen near the victim, a cellmate, the cameras' clue, or being told this one
# did it (`suspicion.heard`); dislike and fear aren't. Reopening an old murder needs the same read.
reason: 45
convince: { need: 0.5, brave: 0.1, spite: 0.2 }
# Proposal (Nov 18, john: keep the killer accusing someone else). A killer at least `dread` sure
# they'll be caught (guilt.dread) accuses whoever they expect the room to condemn most readily, if
# they expect at least what spite needs plus `margin`. It goes ahead of anyone else's accusation if
# dread × 100 × brave ÷ 10 beats theirs.
frame: { dread: 0.3, margin: 0.05 }

accused: { thought: accused, affection: -30 }   # proposal: how the accused takes it

# Voters (everyone there but the two) who know the truth (saw it, heard a confession) vote against
# the killer. Everyone else starts from how they feel: affection − fearNudge × fear for each side,
# nudged toward condemning someone they fear, and then hears the two argue (argue, below). They
# condemn whichever side ends up lower. Ties on votes break on the meter, then lifetime points.
fearNudge: 0.5          # proposal
survivedThought: survived_trial

# Proposals (Nov 20, john: "people should have the opportunity to make their case and charismatic
# people should have an edge in trials"; D-054). Every contestant rolls charisma 0..10 (generator
# stat; Charmer +2, Abrasive −2 in traits.yaml). A trial is argued: the night before both sides
# plead with voters, then the accuser makes the case, the accused defends, and each voter weighs it.
argue:
  # Presence: charisma + `beauty` × their looks (0..1, ledger.ts looks): good-looking speakers get
  # a little more of a hearing. Used for pleas, reading the room and delivery.
  beauty: 1
  # What the accuser says lands on each voter as `said.k` × what they have (the evidence they
  # could put to the room: suspicion.witnessed for an eyewitness, near, enemy, the clue, being told,
  # or a lie) × (`said.trustBase` + the voter's trust in them ÷ 100). An eyewitness trusted at 50
  # lands 40 (M8's testimony was 20 + 0.5 × trust: without it 40% of trials spaced the wrong person).
  said: { k: 0.4, trustBase: 0.5 }
  # An alibi: someone awake was in the same room as the accused when the murder happened (the sim
  # records where everyone was). The accused claims it: `alibi` × the same credibility, toward them.
  # A voter who was that someone knows, and votes for the accused.
  alibi: 15
  # Delivery, on the day: presence, plus composure and how they're holding up, plus a roll.
  #   calm:      ± this from calm 0 to 10
  #   nerves:    an innocent accused loses this at calm 0, nothing at calm `nervesCalm` or more
  #   dread:     a guilty accused loses this × their dread of being caught (guilt.dread)
  #   hangover:  per point of hangover thought (−3..−10), up to `hangoverMax`
  #   ready:     got ready that morning (activities.yaml ready)
  #   die:       a roll of 0..die
  delivery: { calm: 1.5, nerves: 1, nervesCalm: 6, dread: 3, hangover: 0.3, hangoverMax: 3, ready: 1, die: 3 }
  # Each voter's openness: 1 when their feelings don't split the two, falling by the gap ÷ `span`
  # to `min`. The better speaker moves them `sway` × the delivery gap × openness.
  # Tuning (Nov 20): 3 in the design doc; 4 lets the speeches overturn about 1 in 6 trials without
  # an eyewitness (3: 1 in 8; 5 no more than 4).
  sway: 4
  openness: { span: 100, min: 0.3 }
  # Each voter takes it their own way: at the trial, a whim of up to ± `noise` on where they stand.
  # Reading the room counts a voter that close to the line as the odds they fall each way.
  noise: 10
  # Lies (john: yes). An accuser with less than `reason` to say, honest `honest` or below, makes it
  # up: they claim to have seen the accused near the victim (`claim`, a suspicion value). It lands
  # like the real thing, but delivery loses `base` + `perHonest` × honest. Any voter who was with the
  # accused or the accuser when it happened knows it's a lie: they vote against the liar, take
  # `affection` toward them, and know them for a liar (news.yaml reputation.liar), which spreads.
  lie: { honest: 4, claim: 40, base: 1, perHonest: 0.5, affection: -20 }
  # Reading the room: the accuser expects to talk people round too. Their forecast counts what
  # they'll say and the gap between their presence and the accused's (no roll), with `vain` × (vain
  # − 5) ÷ 5 added to their own (john: yes, the vain overrate themselves); at vain 5 or below, none.
  forecast: { vain: 2 }
  # The night before (john: try it). From the accusation to the trial, both sides plead their case
  # (social.yaml plead). A plea leaves the voter `base` × presence ÷ 5 leaning their way, up to `max`
  # from each side, gone after the trial. Someone who dislikes them below `refuseBelow`, or believes
  # they're a killer, won't hear it (logged as plead_refused).
  plead: { base: 5, max: 10, refuseBelow: -30 }
  # A speech that lands is good television (john: yes): trial_speech scores by grade (scoring.yaml),
  # strong at delivery `strong` or more, weak under `weak`. Delivery averages about 6.
  grade: { strong: 9, weak: 4 }

# Proposal (season logs, Oct 23: after a killer walked free nobody treated them differently).
# Someone comes to believe a contestant is a killer when they witness the murder, or at a trial
# where that contestant survives (cleared, or saved by an immunity): the accuser and every voter
# who voted to space them. Believing it is a belief, so an innocent who survived an accusation
# can be shunned too. Each believer takes it once: affection and fear toward them, `friend` more
# affection if the victim was their friend, affection down to `floor` at least however much they
# liked them before, and `thought`. Their dislike never fades past `floor`
# (a rival, social.yaml ledger rivalAt), so it feeds the cage, envy, attack breaks and the next
# trial's votes. Every ten minutes in a room with someone they believe is a killer: `near`.
memory: { affection: -30, fear: 20, friend: -30, floor: -30, thought: knows_killer, near: near_killer }

# Proposal (Nov 18, john: suspicion of a killer should spread fastest of all gossip; news.yaml
# killer). Believing it on someone's word lands softer than seeing it: these instead of
# memory.affection and memory.fear (the friend hit and the floor still apply). A loyal friend of the
# accused (loyal at least doubt.loyal, affection friendAt or more) doesn't believe it.
hearsay: { affection: -15, fear: 10, doubt: { loyal: 7, charisma: 0.3 } }
# Proposal (Nov 20): `doubt.charisma` × (5 − the teller's presence) ÷ 5: a rumor from someone with
# little charisma isn't believed at those odds (charisma 0: 30%); from charisma 5 up, it always is.

# Proposal (Nov 18, john: "people romance their partner's killer"). Someone who believes another
# is a killer shies away from anything warm with them, both ways: they rarely start one of `warm`
# with them (× 1 − wariness), and when the killer starts one, they turn it down at odds of their
# wariness (logged as `snub`; the killer feels brushed off), and they say no to a conversation the
# same way. Wariness = known + fear × their fear ÷ 100 × (1 + braveK × (brave − 5) ÷ 5), up to 1;
# `mine` (1: never) if the one murdered was someone they loved (affection friendAt or more). Insults,
# confrontations and accusations aren't warm: a brave or cruel person can still go and taunt them.
wary:
  known: 0.4
  fear: 1
  braveK: -0.5
  mine: 1
  warm: [chitchat, deep_talk, kind_words, flirt, gift, kiss, proposition, invite, ask_exclusive, glass_talk, pass_food, share_snack]
  snub: snub

# Proposals (Nov 11, john: "shouldn't there be guilt that depends on the personality and
# circumstances?" rather than a flat rule that a killer never grieves their victim). Every guilt
# thought here is source guilt, so it's × honest and × kind (thoughts.yaml sources) and × volatility:
# a kind, honest, volatile killer is wrecked; a cruel liar barely feels it.
guilt:
  # At the kill: `thought` worth base − perAffection × how they felt about the victim just before,
  # never above 0. Killing a friend (affection 60) is −16 before personality; a stranger −10; someone
  # they hated (−100) nothing. Like anyone else, a killer who liked the victim grieves them too and a
  # cruel one gloats over a rival (show.ts mourn), but nobody is shaken by a death they caused.
  remorse: { thought: killed_them, base: -10, perAffection: 0.1 }
  # Proposal (Nov 18, john: "there should be catharsis from a kill, but also remorse and fear of
  # getting punished, all depending on personality"). The break that ends in a kill ends with
  # `rush` instead of the usual catharsis: the cruel and the volatile feel it most, the kind barely.
  rush: killing_rush
  # Fear of being caught (`dread.thought`), by how sure they are someone knows, 0..1: `seen` if
  # anyone saw it, `unseen` if nobody did. It jumps to at least `accused` when they're accused,
  # `confessed` when someone hears them confess, and `snubbed` when someone who believes it turns them down; it drops × `otherAccused` when someone
  # else is accused of it and × `cleared` when they walk free from a trial. Between, it halves every
  # `halfLifeDays`: days without suspicion ease it. The thought is value × that, refreshed hourly,
  # gone under `min`. It's fear, so the brave feel it least.
  dread:
    thought: fear_caught
    value: -14
    unseen: 0.4
    seen: 1
    accused: 1
    snubbed: 0.6
    confessed: 1
    otherAccused: 0.5
    cleared: 0.4
    halfLifeDays: 3
    min: 0.1
  # Back in the room where they did it, while the remorse lasts: `haunted`, refreshed every ten minutes.
  haunted: haunted
  # A trial spaces an innocent for their murder: `scapegoat` about them, `framed` worse if the killer
  # was the accuser. Walking free from their own trial or someone else's: `gotAway` (the cruel enjoy
  # it; at kind 10 it's nothing).
  scapegoat: { thought: scapegoat, framed: -6 }
  gotAway: got_away
  # Guilt has to come out. How heavy it is: their crime's guilt thoughts added up; at `full` or
  # more, they're as likely to let it out as anything (× guilt ÷ full below that).
  #   the diary room: their crime is a topic (confessionals.yaml murder), worth × that share; it can
  #     air at dinner like any tape
  #   drink: chatting with a friend (affection friendAt+), the stage's `confess` chance × that share
  #     (booze.yaml): a tearful confession
  #   a guilt break (breaks.yaml blurt): it all comes out in front of the room
  full: 15
  # Someone told in confidence keeps the secret if they're at least `keep.loyal` loyal and still a
  # friend (affection friendAt+): `keep.thought` instead of believing it.
  keep: { loyal: 7, thought: keeping_secret }

# Proposals (Nov 11, unsolved murders resurface): a murder stays on the books while its killer is
# aboard. Whenever someone comes to know the truth (a confession, a tape at dinner, a witness the
# room didn't believe), the bravest one who knows and hasn't accused the killer over it yet does,
# if certainty (suspicion.witnessed) × brave ÷ 10 reaches accuseAt, and it goes to the next
# morning's trial. Anyone who heard the confession counts as a witness there (testimony, voting the
# truth). It's tried again after a wrong verdict too, if somebody knows.
reopen: true
