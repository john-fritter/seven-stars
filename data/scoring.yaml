# Deterministic scoring, slice one's stand-in for the judge. DESIGN.md Part two, The meter and
# scoring. Every award goes to the meter (capped) and lifetime points (uncapped) together.
#
# Each row is keyed by the event type it scores. Who gets what:
#   each:      every actor
#   actor:     the first actor (who started it)
#   target:    the second actor
#   winner / loser: the contestant named in the event's data
#   witnesses: every witness (awake, in the same room, not an actor), on top of the rest
# only:      a data field that must be true for the event to score (fights: outside the cage)
# witnessed: false skips the witness multiplier (proposal: infractions, sentences and anything
#            at the ceremony, where everyone is always watching)
# by / cases: a data field whose value picks a case, which replaces the row's amounts
# meterOnly: the award goes to the meter but not lifetime points
# secret:    hidden lifetime points for the first actor, revealed when they die (murder)

awards:
  # Ratings rebalance (proposal, Oct 29; john: drain faster, bigger rewards for the most dramatic
  # acts). Talk is now a chosen activity, so the small stuff is everywhere and pays less; drama pays more.
  deep_talk:   { each: 2 }                # was 4 (personality step 2), 2 before that
  kind_words:  { actor: 1 }               # "Gift; kind words: 2 giver; 1"
  gift:        { actor: 2 }
  slight:      { each: 2 }
  insult:      { actor: 8, target: 3 }    # was 4 / 2
  fight:       { each: 20, winner: 10, only: outsideCage }   # was 12 / 6
  flirt:       { each: 4 }                # a flirt that lands
  rebuff:      { actor: 3 }               # the rebuffed flirter
  kiss:        { each: 10 }               # was 6
  lovin:       { each: 4, by: first, cases: { "true": { each: 20 } } }   # 20 each the first time with that person (was 3 / 12)
  betrayal:    { each: 25 }               # was 10;               # discovered: the betrayed, the betrayer and the third party
  breakup:     { each: 15 }               # was 8
  break:       { by: level, cases: { minor: { actor: 5 }, major: { actor: 15 }, extreme: { actor: 25 } } }   # major and extreme were 10 / 15
  hammered:    { actor: 4 }               # hammered antics, once per time they get hammered
  # Proposals (Oct 23): loose lips, confessions and scenes (romance.yaml gossip), puking and
  # passing out (booze.yaml). A scene's break pays as a break; this is the airing on top.
  blab:        { actor: 3, target: 1 }
  confession:  { each: 20 }               # was 10
  scene:       { actor: 12 }              # was 6
  puke:        { actor: 4 }
  passed_out:  { actor: 3 }
  # Proposals (Oct 30, things to do): a hand of cards won, a cheat called out at the table, and a
  # training montage (a workout or rehearsal for a match they're booked into).
  cards:       { winner: 2 }
  caught_cheating: { each: 3 }
  training:    { actor: 3 }
  karaoke:     { actor: 3 }               # a finished karaoke performance
  infraction:  { actor: 4, witnessed: false }
  sentence:    { actor: 6, witnessed: false }
  fishbowl_night: { actor: 8, witnessed: false }   # paid on release
  death:       { witnesses: 3, witnessed: false }  # "witnessed a death"
  murder:      { actor: 40, meterOnly: true, secret: 100, witnessed: false }  # 40 to the meter, 100 hidden lifetime
  # The daily event and trials. Everyone is watching, so no witness multiplier.
  cage_match:  { winner: 25, loser: 10, witnessed: false }
  dance_off:   { each: 5, winner: 15, witnessed: false }  # 20 to the winner, 5 to each other dancer
  trial:       { winner: 15, witnessed: false }           # "trial survived (accuser or accused)"

modifiers:
  witnessEach: 0.15        # × 1 + 0.15 per witness
  witnessMax: 2            # up to × 2
  repeatDays: 3            # the same event between the same pair within this many days...
  repeatFactor: 0.5        # ...is worth this much more each repeat (half, a quarter, ...)
  boredom: 0.1             # each event type loses this share every time it happens station-wide
                           # that day, recovering overnight (at midnight)
  ownRepeat: 0.7           # their act gets old: each time a contestant already scored that type today as
                           # an actor, × 0.7 more (personality step 2; resets at midnight with boredom)

# The ratings pull (personality step 2, all proposals). As the meter falls, whatever would score
# pulls harder, weighted by the contestant's own taste for it (src/core/ratings.ts).
#   desperation = max(0, 1 − meter ÷ from) ^ power
#   actions:      added to an action's score: actions × desperation × points ÷ 10 × taste
#                 (only actions that log a scoring event, like karaoke)
#   interactions: an interaction type's weight × 1 + interactions × desperation × points ÷ 10 × taste
#   chance:       the chance of starting an interaction × 1 + chance × desperation
#   shyness:      desperation overcomes shyness: for that chance, outgoing counts as
#                 outgoing + (10 − outgoing) × shyness × desperation
# Points are the actor's share (each + actor) after the judge's boredom and their own repeats today.
# pays: an interaction scored through another event's row, e.g. { proposition: lovin }. Left empty
# (proposal): desperate singles propositioning for the cameras costs hookups within a couple.
# ignore: interactions never pulled.
ratings:
  from: 75     # ratings rebalance (Oct 29): was 50; people start playing to the cameras sooner
  power: 2
  actions: 10
  interactions: 5
  chance: 1
  shyness: 0.5
  pays: {}
  ignore: [breakup]   # proposal: nobody dumps someone for the cameras (it would only cost the couple targets)

# Surprise pays: the first actor's award × 1 + bonus × max(0, 1 − taste), where taste is the same
# multiplier as above (the personality grid for an action's tags, an interaction's axis scale
# factors and traits). acts: an event scored as another act's taste (a rebuff is a flirt).
surprise:
  bonus: 1
  acts: { rebuff: flirt }
