# Choosing actions. DESIGN.md Part two, Choosing actions.
noise: [0.85, 1.15]
topChoices: 3                 # a weighted pick among the best few
# Proposal (day traces, Oct 29): only options scoring at least this share of the best are in the
# pick. Was 0: a rank 1 at 00:45 with their suite bed at 4.8 still took the couch (0.8) one time in ten.
withinOfBest: 0.6
walkCostPerMinute: 0.05       # proposal
# Proposal (day traces, Oct 29; john approved): chores are done for themselves. Liking the people in
# the room adds nothing to an action tagged this, so nobody washes their hands eleven times next
# to a friend. (Sleep and the toilet never had it.)
choreTag: chore
modestyCost: 1.0              # proposal: × modesty / 10, for exposed actions with others in the room
modestyThought: no_privacy    # proposal: finishing an exposed action with someone awake watching (scaled by modesty)
recreationTaste:              # proposal: fun gains × this
  favorite: 1.5
  other: 0.8
mealPull: 2.25                # proposal: the pull of a scheduled meal on top of hunger; need sliders (Oct 28): was 3, and 96% of meals happened on a full stomach
nightSleepPull: 3             # proposal: the pull of a bed between lights-dim and the wake chime, × bed quality
# Proposal (season logs, Oct 23: one singer did a quarter of a season's karaoke, 173 songs in
# one month). A performance (an action that logs a scoring event) scores × encore for each time
# they've already done it today, so the stage gets passed around.
encore: 0.6
idle:                         # proposal: the fallback when nothing scores
  minutes: 15
  score: 0.05
